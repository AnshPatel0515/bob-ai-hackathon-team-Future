submission:
  title: "Supply Chain Assistant"                            
  problem_statement: >               
    Supply chain disruptions — weather events, port strikes, geopolitical crises — cascade
across hundreds of active shipments in ways that are impossible to track manually. Fleet
assets (trucks, containers, vessels) sit idle while other routes are overloaded. Cold chain
shipments (vaccines, perishables) are especially vulnerable — a single temperature
excursion across any leg can spoil a $500K+ cargo, but breaches are only discovered at
delivery when it is too late.

  solution_summary: >                  
   Build a Bob solution that identifies which shipments are affected by an
active disruption, recommends re-routing or carrier alternatives,
identifies idle fleet assets for redeployment, and monitors cold chain IoT
sensor logs to detect temperature excursions and classify their
regulatory severity before delivery.

  key_features:                       
    - "Shipment Tracking"                               
    - "Disruption Detection"
    - "AI Risk Prediction"
    - "Smart Route Optimization"                               
    - "Fleet Utilisation"                              

  tech_stack:
    languages: ["Python","typeScript"]                      
    frameworks: ["FastAPI"]                    
    ibm_technologies: ["IBM BOB"]              
    databases: ["PostgreSQL"]                  
    other: ["GitHub Actions"]                  

  what_we_are_most_proud_of: >        
    AI-powered solution that predicts supply-chain disruptions early.
Real-time shipment tracking and instant disruption alerts.
Smart route optimization to reduce delivery delays and transportation costs.
Better fleet utilisation by reducing idle vehicles and resources.
Cold-chain protection for temperature-sensitive shipments.
User-friendly dashboard that helps logistics managers make faster decisions.
Scalable and practical idea that can be used in real-world logistics operations.

  known_limitations: >                 
   Depends on accurate and real-time data from weather, traffic, ports, and shipment systems.
AI predictions may not always be 100% accurate.
Live tracking requires GPS and internet connectivity.
Initial setup and integration with existing logistics systems may be complex.
Small companies may face high implementation and maintenance costs.
Cold-chain monitoring requires suitable IoT temperature sensors.
Unexpected events may occur that the system cannot predict in advance.

